name: Daily Report

on:
  schedule:
    # 22:00 Moscow (UTC+3) = 19:00 UTC; after late manager calls are in Planfix
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      manager:
        description: 'Менеджер (alias или --all для всех)'
        required: false
        default: '--all'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Pull latest cache files
        run: git pull origin main || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Generate reports for all managers
        env:
          PLANFIX_URL: ${{ secrets.PLANFIX_URL }}
          PLANFIX_TOKEN: ${{ secrets.PLANFIX_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          POLZA_API_KEY: ${{ secrets.POLZA_API_KEY }}
        run: |
          TODAY=$(TZ=Europe/Moscow date +%d-%m-%Y)
          MANAGER="${{ github.event.inputs.manager || '--all' }}"
          echo "Generating reports for $TODAY (manager: $MANAGER)"
          if [ "$MANAGER" = "--all" ]; then
            node analytics.js --all "$TODAY"
          else
            node analytics.js "$MANAGER" "$TODAY"
          fi

      - name: Verify reports
        if: always()
        continue-on-error: true
        env:
          PLANFIX_URL: ${{ secrets.PLANFIX_URL }}
          PLANFIX_TOKEN: ${{ secrets.PLANFIX_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TODAY=$(TZ=Europe/Moscow date +%d-%m-%Y)
          node verify.js --all "$TODAY"

      - name: Commit data files
        if: always()
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add ai_cache.json deal_history.json latest_data.json funnel_snapshot.json daily_log.txt report.html data/ reports/ deploy/ managers.json transcriptions_cache.json
          git diff --cached --quiet || git commit -m "Report $(TZ=Europe/Moscow date +%d.%m.%Y) $(TZ=Europe/Moscow date +%H:%M)"
          # При конфликте — приоритет CI-версии данных (ours = то что CI сгенерировал)
          git pull --no-rebase -X ours || true
          git push || { git push --force-with-lease; }

      - name: Deploy to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: gh-pages
